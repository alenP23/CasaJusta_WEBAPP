<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-admin}">
<head>
    <title>Viviendas Vendidas/Alquiladas</title>
</head>
<body>

    <header layout:fragment="top-header" class="top-header">
        <div class="header-filters">
            <h1 class="page-title">Viviendas Vendidas/Alquiladas</h1>
        </div>
        <!-- INCLUIMOS EL FRAGMENTO DE ACCIONES -->
        <div th:replace="~{fragmentos/header/header-actions :: header-actions}"></div>
    </header>

    <div layout:fragment="content">
        <div class="table-container">
            <table class="users-table">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>DNI</th>
                        <th>Usuario</th>
                        <th>Nombre</th>
                        <th>Apellido</th>
                        <th>Email</th>
                        <th>Fecha Nac.</th>
                        <th>Género</th>
                        <th>Rol</th>
                        <th>Fumador</th>
                        <th>Mascotas</th>
                        <th>Pareja</th>
                        <th>Acciones</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(usuarios)}">
                        <td colspan="13" class="no-results">No hay usuarios registrados.</td>
                    </tr>
                    <tr th:each="usuario : ${usuarios}">
                        <td th:text="${usuario.usuarioId}">1</td>
                        <td th:text="${usuario.dni}">12345678A</td>
                        <td th:text="${usuario.nombreUsuario}">juan123</td>
                        <td th:text="${usuario.nombre}">Juan</td>
                        <td th:text="${usuario.apellido}">García</td>
                        <td th:text="${usuario.email}">juan@email.com</td>
                        <td th:text="${usuario.fechaNacimiento}">1990-05-15</td>
                        <td th:text="${usuario.genero}">Hombre</td>
                        <td>
                            <span class="role-badge" th:classappend="${usuario.rol == 'ADMIN'} ? 'role-admin' : 'role-user'" 
                                  th:text="${usuario.rol}">USER</span>
                        </td>
                        <td>
                            <i class="fas" th:classappend="${usuario.perfilConvivencia != null && usuario.perfilConvivencia.fumador} ? 'fa-check text-success' : 'fa-times text-danger'"></i>
                        </td>
                        <td>
                            <i class="fas" th:classappend="${usuario.perfilConvivencia != null && usuario.perfilConvivencia.mascotas} ? 'fa-check text-success' : 'fa-times text-danger'"></i>
                        </td>
                        <td>
                            <i class="fas" th:classappend="${usuario.perfilConvivencia != null && usuario.perfilConvivencia.pareja} ? 'fa-check text-success' : 'fa-times text-danger'"></i>
                        </td>
                        <td>
                           <button class="action-btn delete btn-eliminar-usuario" 
                                   type="button" 
                                   th:data-id="${usuario.usuarioId}"
                                   th:data-nombre="${usuario.nombre} + ' ' + ${usuario.apellido}"
                                   title="Eliminar">
                               <i class="fas fa-trash"></i>
                           </button>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>

        <!-- INCLUIR MODAL DE ELIMINAR USUARIO -->
        <div th:replace="~{fragmentos/modales/modal-eliminar-usuario :: modal-eliminar-usuario}"></div>
    </div>

</body>
</html>
