<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Inicio - CasaJusta</title>
</head>
<body>
    <h1>Bienvenido a CasaJusta</h1>
    
    <!-- Solo mostramos si existe username -->
    <div th:if="${username != null}">
        <p>Usuario: <span th:text="${username}">usuario</span></p>
        <p>Rol: <span th:text="${rol}">rol</span></p>
    </div>
    
    <div th:if="${username == null}">
        <p>No hay usuario autenticado</p>
    </div>
    
    <form th:action="@{/logout}" method="post">
        <button type="submit">Cerrar sesión</button>
    </form>
</body>
</html>
