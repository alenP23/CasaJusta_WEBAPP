<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Iniciar Sesión - CasaJusta</title>
    
    <!-- Bootstrap CDN (cumple rúbrica nivel 2 frontend) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    
    <!-- Tu CSS personalizado -->
    <link rel="stylesheet" th:href="@{/css/footer.css}">
    <link rel="stylesheet" th:href="@{/css/header.css}">
    <link rel="stylesheet" th:href="@{/css/login.css}">


</head>
<body>
    <div th:replace="~{fragmentos/header :: header-principal}"></div>
    <main class="login-fondo-con-imagen">
        <div class="login-boton-superior">
            <a th:href="@{/registro}" class="btn-flotante-login">
                Registrarse
            </a>
        </div>
    <div class="container">
        <div class="row justify-content-center align-items-center min-vh-100">
            <div class="col-md-5 col-lg-4">
                
                <!-- Tarjeta de login -->
                <div class="card shadow-lg border-0">
                    <div class="card-body p-5">
                        
                        <!-- Logo / Título -->
                        <div class="text-center mb-4">
                            <h2 class="fw-bold text-primary">🏠 CasaJusta</h2>
                            <p class="text-muted">Inicia sesion para continuar</p>
                        </div>

                        <!-- Formulario -->
                        <form th:action="@{/login}" method="post">
                            
                            <!-- Campo usuario -->
                            <div class="mb-3">
                                <label for="username" class="form-label">Usuario</label>
                                <input type="text" 
                                       class="form-control" 
                                       id="username" 
                                       name="username" 
                                       placeholder="Tu usuario" 
                                       required>
                            </div>

                            <!-- Campo contraseña -->
                            <div class="mb-3">
                                <label for="password" class="form-label">Contraseña</label>
                                <input type="password" 
                                       class="form-control" 
                                       id="password" 
                                       name="password" 
                                       placeholder="Tu contraseña" 
                                       required>
                            </div>

                            <!-- Recordarme -->
                            <div class="mb-3 form-check">
                                <input type="checkbox" class="form-check-input" id="remember">
                                <label class="form-check-label" for="remember">Recordarme</label>
                            </div>

                            <!-- Botón -->
                            <div class="d-grid">
                                <button type="submit" class="btn btn-primary btn-lg">
                                    Iniciar Sesión
                                </button>
                            </div>

                            <!-- Mensaje de error (Thymeleaf) -->
                            <div th:if="${param.error}" class="alert alert-danger mt-3 text-center">
                                Usuario o contraseña incorrectos.
                            </div>
                            
                            <div th:if="${param.logout}" class="alert alert-success mt-3 text-center">
                                Has cerrado sesión correctamente.
                            </div>
                            <div class="text-center mt-3">
                                <a th:href="@{/registro}" class="text-decoration-none">¿No tienes cuenta? Regístrate</a>
                            </div>
                        </form>

                        <!-- Enlaces extra -->
                        <div class="text-center mt-3">
                            <a href="#" class="text-decoration-none">¿Olvidaste tu contraseña?</a>
                        </div>

                    </div>
                </div>

            </div>
        </div>
    </div>
    </main>
    <div th:replace="~{fragmentos/footer :: footer-principal}"></div>
    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
