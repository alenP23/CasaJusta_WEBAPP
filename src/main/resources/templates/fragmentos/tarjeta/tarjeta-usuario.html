<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- FRAGMENTO USUARIO -->
    <div th:fragment="tarjeta-usuario(vivienda)" class="property-card" 
         th:data-id="${vivienda.viviendaID}">
        
        <div class="property-image">
            <img th:src="@{/images/casa_default.jpg}" alt="Imagen vivienda">
            <span class="property-badge" 
                  th:classappend="${vivienda.tipoOperacion == 'alquiler'} ? 'badge-alquiler' : 'badge-compra'" 
                  th:text="${vivienda.tipoOperacion}">Alquiler</span>
            
            <!-- Badge de compatibilidad -->
            <div th:if="${perfilConvivencia != null}" class="compatibility-badge"
                 th:classappend="${(perfilConvivencia.mascotas == vivienda.mascotas) && 
                                  (perfilConvivencia.fumador == vivienda.fumador) && 
                                  (perfilConvivencia.pareja == vivienda.pareja)} ? 'compatible' : 'partial'">
                <i class="fas fa-user-check"></i>
                <span th:text="${(perfilConvivencia.mascotas == vivienda.mascotas) && 
                               (perfilConvivencia.fumador == vivienda.fumador) && 
                               (perfilConvivencia.pareja == vivienda.pareja)} ? '100% compatible' : 'Ver compatibilidad'">
                    Compatible
                </span>
            </div>
        </div>
        
        <div class="property-details">
            <h3 th:text="${vivienda.titulo}">Título del anuncio</h3>
            <p class="property-location"><i class="fas fa-map-marker-alt"></i> 
                <span th:text="${vivienda.direccion}">Dirección</span>
            </p>
            
            <div class="property-features">
                <span><i class="fas fa-bed"></i> <span th:text="${vivienda.habitaciones}">3</span> hab.</span>
                <span><i class="fas fa-bath"></i> <span th:text="${vivienda.banos}">2</span> baños</span>
                <span><i class="fas fa-ruler-combined"></i> <span th:text="${vivienda.metrosCuadrados}">85</span> m²</span>
                <span><i class="fas fa-users"></i> <span th:text="${vivienda.cupoPersonas}">4</span> pers.</span>
            </div>
            
            <!-- Convivencia con iconos circulares -->
            <div class="property-convivencia">
                <span th:classappend="${vivienda.mascotas} ? 'active' : 'inactive'" title="Mascotas">
                    <i class="fas fa-paw"></i>
                </span>
                <span th:classappend="${vivienda.fumador} ? 'active' : 'inactive'" title="Fumador">
                    <i class="fas fa-smoking"></i>
                </span>
                <span th:classappend="${vivienda.pareja} ? 'active' : 'inactive'" title="Pareja">
                    <i class="fas fa-heart"></i>
                </span>
            </div>
            
            <p class="property-price" 
               th:text="${#numbers.formatDecimal(vivienda.precio, 0, 'POINT', 0, 'COMMA')} + ' €'">
                1.200 €
            </p>
        </div>
        
        <div class="property-actions">
            <!-- Botón Contactar -->
            <button class="btn-contact" type="button" th:onclick="|contactarAnunciante(${vivienda.viviendaID})|">
                <i class="fas fa-envelope"></i> Contactar
            </button>
            
            <!-- Botón Apuntarse / Desapuntarse -->
            <div th:if="${username != null}" class="btn-apuntarse-wrapper" onclick="event.stopPropagation();">
                
                <!-- Disponible para apuntarse -->
                <form th:if="${usuarioApuntado != null && usuarioApuntado[vivienda.viviendaID] != null && !usuarioApuntado[vivienda.viviendaID] && (contadorInscritos == null || contadorInscritos[vivienda.viviendaID] == null || contadorInscritos[vivienda.viviendaID] < vivienda.cupoPersonas)}"
                      th:action="@{/anuncio/} + ${vivienda.viviendaID} + '/apuntarse'" method="post" style="margin: 0;">
                    <button type="submit" class="btn-apuntarse" title="Apuntarme">
                        <i class="fas fa-user-plus"></i>
                        <span th:if="${contadorInscritos != null && contadorInscritos[vivienda.viviendaID] != null}" 
                              class="apuntarse-numero" 
                              th:text="${contadorInscritos[vivienda.viviendaID]}">2</span>
                    </button>
                </form>
                
                <!-- Ya está apuntado → Botón para desapuntarse -->
                <form th:if="${usuarioApuntado != null && usuarioApuntado[vivienda.viviendaID] != null && usuarioApuntado[vivienda.viviendaID]}"
                      th:action="@{/anuncio/} + ${vivienda.viviendaID} + '/desapuntarse'" method="post" style="margin: 0;">
                    <button type="submit" class="btn-apuntarse apuntado" title="Desapuntarme">
                        <i class="fas fa-check"></i>
                        <span th:if="${contadorInscritos != null && contadorInscritos[vivienda.viviendaID] != null}" 
                              class="apuntarse-numero" 
                              th:text="${contadorInscritos[vivienda.viviendaID]}">3</span>
                    </button>
                </form>
                
                <!-- Cupo completado -->
                <button th:if="${usuarioApuntado != null && usuarioApuntado[vivienda.viviendaID] != null && !usuarioApuntado[vivienda.viviendaID] && contadorInscritos != null && contadorInscritos[vivienda.viviendaID] != null && contadorInscritos[vivienda.viviendaID] >= vivienda.cupoPersonas}"
                        class="btn-apuntarse completo" disabled title="Cupo completo">
                    <i class="fas fa-lock"></i>
                    <span th:if="${contadorInscritos != null && contadorInscritos[vivienda.viviendaID] != null}" 
                          class="apuntarse-numero" 
                          th:text="${contadorInscritos[vivienda.viviendaID]}">4</span>
                </button>
            </div>
            
            <!-- Login para no autenticados -->
            <a th:if="${username == null}" th:href="@{/login}" class="btn-apuntarse" title="Inicia sesión para apuntarte">
                <i class="fas fa-sign-in-alt"></i>
            </a>
            
            <!-- Botón Favorito -->
            <button class="btn-favorite" type="button" th:onclick="|toggleFavorito(${vivienda.viviendaID})|" title="Favorito">
                <i class="far fa-heart"></i>
            </button>
        </div>
    </div>

</body>
</html>
