<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <!-- FRAGMENTO: Botón hamburguesa + Avatar con dropdown (para todas las páginas admin) -->
    <div th:fragment="header-actions" class="header-actions">
        
        <!-- BOTÓN HAMBURGUESA (solo visible en móvil) -->
        <button class="mobile-menu-btn" id="mobileMenuBtn" type="button" aria-label="Menú">
            <i class="fas fa-bars"></i>
        </button>
        
        <!-- AVATAR CON MENÚ DESPLEGABLE -->
        <div class="user-avatar" id="userAvatar">
            <i class="fas fa-user-circle"></i>
            <span th:if="${username != null}" th:text="${username}">Admin</span>
            
            <!-- MENÚ DESPLEGABLE -->
            <div class="user-dropdown" id="userDropdown">
                <div class="dropdown-header">
                    <i class="fas fa-user-circle"></i>
                    <span th:if="${username != null}" th:text="${username}">Admin</span>
                </div>
                <div class="dropdown-divider"></div>
                <a th:href="@{/admin}" class="dropdown-item">
                    <i class="fas fa-home"></i>
                    <span>Inicio</span>
                </a>
                <a th:href="@{/admin#}" class="dropdown-item">
                    <i class="fas fa-bullhorn"></i>
                    <span>Anuncios</span>
                </a>
                <a th:href="@{/admin/usuarios}" class="dropdown-item">
                    <i class="fas fa-users"></i>
                    <span>Usuarios</span>
                </a>
                <a th:href="@{/admin/vendidas}" class="dropdown-item">
                    <i class="fas fa-check-circle"></i>
                    <span>Vendidas/Alquiladas</span>
                </a>
                <a th:href="@{/admin/configuracion}" class="dropdown-item">
                    <i class="fas fa-cog"></i>
                    <span>Configuración</span>
                </a>
                <div class="dropdown-divider"></div>
                <form th:action="@{/logout}" method="post" class="dropdown-item logout-form">
                    <button type="submit" class="dropdown-logout-btn">
                        <i class="fas fa-sign-out-alt"></i>
                        <span>Cerrar sesión</span>
                    </button>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
