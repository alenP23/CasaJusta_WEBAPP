<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="header-usuario">
        <!-- HEADER: Título -->
        <header class="header-tituluaren-container">
            <div class="header-orriaren-izena">
                <h1 id="header-titulua">CasaJusta</h1>
            </div>
        </header>
        
        <!-- NAVBAR: Navegación -->
        <nav class="navbar-container">
            <div class="navbar-content">
                <!-- Botones a la izquierda -->
                <div class="nav-links">
                    <a th:href="@{/vista_casas_usuario}" class="navbar-btn">Inicio</a>
                    <a th:href="@{/mis-propiedades}" class="navbar-btn">Mis Propiedades</a>
                    <a href="#" class="navbar-btn">Notificaciones</a>
                    <a th:href="@{/mapa}" class="navbar-btn">Mapa</a>
                </div>
                
                <!-- Logout + Usuario a la derecha -->
                <div class="user-actions" th:if="${username != null}">
                    <!-- LOGOUT a la izquierda del usuario -->
                    <form th:action="@{/logout}" method="post" class="logout-form">
                        <button type="submit" class="btn-logout" title="Cerrar sesión">
                            <i class="fas fa-sign-out-alt"></i>
                        </button>
                    </form>
                    
                    <!-- USUARIO a la derecha del logout -->
                    <a th:href="@{/usuario/configuracion}" class="user-icon">
                        <i class="fas fa-user-circle"></i>
                        <span th:text="${username}">Usuario</span>
                    </a>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
