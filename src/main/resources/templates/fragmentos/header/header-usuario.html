<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>
    <div th:fragment="header-usuario">
        <!-- HEADER: Título -->
        <header class="header-tituluaren-container">
            <div class="header-orriaren-izena">
                <h1 id="header-titulua">CasaJusta</h1>
            </div>
        </header>
        
        <!-- NAVBAR: Navegación -->
        <nav class="navbar-container">
            <div class="navbar-content">
                <!-- Botones a la izquierda -->
                <div class="nav-links">
                    <a th:href="@{/vista_casas_usuario}" class="navbar-btn">Inicio</a>
                    <a href="#" class="navbar-btn">NotificacionesAlen</a>
                     <a href="#" class="navbar-btn">Mapa</a>
                </div>
                
                <!-- Usuario a la derecha -->
                <div class="user-icon" th:if="${username != null}">
                    <i class="fas fa-user-circle"></i>
                    <span th:text="${username}">Usuario</span>
                </div>
            </div>
        </nav>
    </div>
</body>
</html>
