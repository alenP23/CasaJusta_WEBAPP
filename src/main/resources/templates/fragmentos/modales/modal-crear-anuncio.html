<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="modal-crear" class="modal-overlay" id="modalOverlay">
        <div class="modal">
            <div class="modal-header">
                <h2>Agregar nuevo anuncio</h2>
                <button class="modal-close" id="closeModal" type="button" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <!-- ✅ enctype="multipart/form-data" AÑADIDO -->
                <form id="addPropertyForm" th:action="@{/admin/anuncios/crear}" method="post" enctype="multipart/form-data">
                    <div class="form-group">
                        <label for="propTitle">Título del anuncio</label>
                        <input type="text" id="propTitle" name="titulo" placeholder="Ej: Apartamento en el centro" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="propType">Tipo de operación *</label>
                            <select id="propType" name="tipoOperacion" required>
                                <option value="" disabled selected>Selecciona tipo</option>
                                <option value="alquiler">Alquiler</option>
                                <option value="compra">Compra</option>
                            </select>
                        </div>
                        <div class="form-group">
                            <label for="propPrice">Precio estimado (€)</label>
                            <input type="number" id="propPrice" name="precio" placeholder="Selecciona tipo y metros" readonly 
                                   style="background-color: #f0f0f0; cursor: not-allowed;" step="0.01">
                            <small id="precioInfo" style="color: #666; font-size: 0.8em; display: block; margin-top: 4px;">
                                Se calcula automáticamente según tipo y m²
                            </small>
                        </div>
                    </div>
                    <div class="form-group">
                        <label for="propLocation">Dirección</label>
                        <input type="text" id="propLocation" name="direccion" placeholder="Calle, Ciudad" required>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="propRooms">Habitaciones</label>
                            <input type="number" id="propRooms" name="habitaciones" placeholder="0" min="0">
                        </div>
                        <div class="form-group">
                            <label for="propBathrooms">Baños</label>
                            <input type="number" id="propBathrooms" name="banos" placeholder="0" min="0">
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group">
                            <label for="propMeters">Metros cuadrados *</label>
                            <input type="number" id="propMeters" name="metrosCuadrados" placeholder="0" min="1" required>
                        </div>
                        <div class="form-group">
                            <label for="propPersons">Cupo personas</label>
                            <input type="number" id="propPersons" name="cupoPersonas" placeholder="0" min="0">
                        </div>
                    </div>
                    
                    <!-- ===== CAMPO IMAGEN ===== -->
                    <div class="form-group">
                        <label>Imagen del anuncio</label>
                        <div class="image-upload-area" id="imageUploadArea">
                            <input type="file" id="propImage" name="imagen" accept="image/*" style="display: none;">
                            <div class="upload-placeholder" id="uploadPlaceholder">
                                <i class="fas fa-cloud-upload-alt"></i>
                                <span>Arrastra una imagen o haz clic para subir</span>
                                <small>JPG, PNG (máx. 5MB)</small>
                            </div>
                            <div class="upload-preview" id="uploadPreview" style="display: none;">
                                <img id="previewImg" src="data:image/gif;base64,R0lGODlhAQABAIAAAAAAAP///yH5BAEAAAAALAAAAAABAAEAAAIBRAA7" alt="Vista previa">
                                <button type="button" class="remove-image" id="removeImage">
                                    <i class="fas fa-times"></i>
                                </button>
                            </div>
                        </div>
                    </div>
                    <!-- ======================== -->
                    
                    <div class="form-group">
                        <label>Preferencias de convivencia</label>
                        <div class="toggle-filters">
                            <button type="button" class="toggle-pill inactive" id="toggleCrearFumador" onclick="toggleCrearFilter('fumador')">
                                <i class="fas fa-smoking"></i>
                                <span>Fumador</span>
                                <input type="hidden" name="fumador" id="inputCrearFumador" value="false">
                            </button>
                            <button type="button" class="toggle-pill inactive" id="toggleCrearMascotas" onclick="toggleCrearFilter('mascotas')">
                                <i class="fas fa-paw"></i>
                                <span>Mascotas</span>
                                <input type="hidden" name="mascotas" id="inputCrearMascotas" value="false">
                            </button>
                            <button type="button" class="toggle-pill inactive" id="toggleCrearPareja" onclick="toggleCrearFilter('pareja')">
                                <i class="fas fa-heart"></i>
                                <span>Pareja</span>
                                <input type="hidden" name="pareja" id="inputCrearPareja" value="false">
                            </button>
                        </div>
                    </div>
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="cancelModal">Cancelar</button>
                        <button type="submit" class="btn btn-primary">Guardar anuncio</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
