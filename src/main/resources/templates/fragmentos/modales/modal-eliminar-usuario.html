<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<body>

    <div th:fragment="modal-eliminar-usuario" class="modal-overlay" id="deleteUserModalOverlay">
        <div class="modal modal-small">
            <div class="modal-header">
                <h2><i class="fas fa-exclamation-triangle"></i> Confirmar eliminación</h2>
                <button class="modal-close" id="closeDeleteUserModal" type="button" aria-label="Cerrar">
                    <i class="fas fa-times"></i>
                </button>
            </div>
            <div class="modal-body">
                <p class="delete-message">¿Estás seguro de que quieres eliminar el siguiente usuario?</p>
                <p class="delete-user-name" id="deleteUserName">Nombre del usuario</p>
                <form id="deleteUserForm" th:action="@{/admin/usuarios/eliminar}" method="post">
                    <input type="hidden" id="deleteUserId" name="id">
                    <div class="modal-actions">
                        <button type="button" class="btn btn-secondary" id="cancelDeleteUser">Cancelar</button>
                        <button type="submit" class="btn btn-danger" id="confirmDeleteUser">Eliminar</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
