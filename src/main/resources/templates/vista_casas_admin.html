<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout"
      layout:decorate="~{layouts/layout-admin}">
<head>
    <title>Anuncios</title>
</head>
<body>

    <header layout:fragment="top-header" class="top-header">
        <div class="header-filters">
            <div th:replace="~{fragmentos/filtros/filtro-convivencia :: filtro-convivencia}"></div>
            <div th:replace="~{fragmentos/filtros/filtro-tipo-operacion :: filtro-tipo-operacion}"></div>
            <div th:replace="~{fragmentos/filtros/filtro-precio :: filtro-precio}"></div>
        </div>
        <!-- INCLUIMOS EL FRAGMENTO DE ACCIONES -->
        <div th:replace="~{fragmentos/header/header-actions :: header-actions}"></div>
    </header>
    <div layout:fragment="content">
        
        <h1 class="section-title">Anuncios</h1>

        
        <div class="properties-grid" id="adminPropertiesGrid">
            
            <div th:if="${#lists.isEmpty(viviendas)}" class="no-results">
                <p>No hay anuncios disponibles.</p>
            </div>

            <th:block th:each="vivienda : ${viviendas}">
                <div th:replace="~{fragmentos/tarjeta/tarjeta-anuncio :: tarjeta-admin(vivienda=${vivienda})}"></div>
            </th:block>

            <div class="admin-property-card add-card" id="addPropertyBtn">
                <div class="add-card-content">
                    <div class="add-icon"><i class="fas fa-plus"></i></div>
                    <p>Agregar anuncio</p>
                </div>
            </div>

        </div>

        <!-- TODOS LOS MODALES FRAGMENTADOS -->
        <div th:replace="~{fragmentos/modales/modal-crear-anuncio :: modal-crear}"></div>
        <div th:replace="~{fragmentos/modales/modal-eliminar-anuncio :: modal-eliminar}"></div>
        <div th:replace="~{fragmentos/modales/modal-editar-anuncio :: modal-editar}"></div>

    </div>

    <th:block layout:fragment="scripts-extra">
        <script th:src="@{/js/filtros_admin.js}"></script>
    </th:block>

</body>
</html>
