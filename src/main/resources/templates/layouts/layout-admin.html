<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org"
      xmlns:layout="http://www.ultraq.net.nz/thymeleaf/layout">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title layout:title-pattern="$CONTENT_TITLE - CasaJusta Admin">Panel Admin</title>
    
    <link rel="stylesheet" th:href="@{/css/admin/admin-base.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-sidebar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-header.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-cards.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-modals.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-tables.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-filtros.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-configuracion.css}">
    
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <th:block layout:fragment="head-extra"></th:block>
</head>
<body>

    <div th:replace="~{fragmentos/navbar/sidebar-admin :: sidebar-admin}"></div>

    <main class="main-content">
        
        <!-- HEADER: reemplazable por cada página, pero con fragmento por defecto -->
        <header class="top-header" layout:fragment="top-header">
            <div class="header-filters">
                <h1 class="page-title">Panel de Administración</h1>
            </div>
            <!-- Fragmento por defecto (las páginas pueden incluirlo o hacerlo manual) -->
            <div th:replace="~{fragmentos/header/header-actions :: header-actions}"></div>
        </header>

        <section class="content-section" layout:fragment="content">
        </section>

    </main>

    <script th:src="@{/js/admin.js}"></script>
    <th:block layout:fragment="scripts-extra"></th:block>

</body>
</html>
