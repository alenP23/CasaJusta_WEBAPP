<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head th:replace="~{fragmentos/head-vista-casas :: head-vista-casas('CasaJusta - Pisos en Alquiler y Venta')}">
</head>
<body>

    <!-- HEADER + NAVBAR -->
    <div th:replace="~{fragmentos/header-con-nav :: header-con-nav}"></div>

    <!-- MAIN -->
    <main class="main-container">
        
        <div class="section-header">
            <h1 class="section-title">Anuncios</h1>
            <button class="filter-btn" id="filterToggle" type="button" aria-label="Abrir filtros">
                <i class="fas fa-filter"></i>
            </button>
        </div>

        <div class="properties-grid" id="propertiesGrid">
            
            <div th:if="${#lists.isEmpty(viviendas)}" class="no-results">
                <p>No hay viviendas disponibles en este momento.</p>
            </div>

            <div th:each="vivienda : ${viviendas}" class="property-card" th:data-id="${vivienda.viviendaID}">
                
                <div class="property-image">
                    <img th:src="@{/images/casa_default.jpg}" alt="Imagen vivienda">
                    <span class="property-badge" th:text="${vivienda.tipoOperacion}">Alquiler</span>
                </div>

                <div class="property-info">
                    <h2 class="property-title" th:text="${vivienda.titulo}">Título</h2>
                    <p class="property-address">
                        <i class="fas fa-map-marker-alt"></i>
                        <span th:text="${vivienda.direccion}">Dirección</span>
                    </p>
                    
                    <div class="property-features">
                        <span><i class="fas fa-ruler-combined"></i> <span th:text="${vivienda.metrosCuadrados}">80</span> m²</span>
                        <span><i class="fas fa-bed"></i> <span th:text="${vivienda.habitaciones}">3</span> hab.</span>
                        <span><i class="fas fa-bath"></i> <span th:text="${vivienda.banos}">2</span> baños</span>
                    </div>

                    <div class="property-price-row">
                        <span class="property-price" th:text="${#numbers.formatDecimal(vivienda.precio, 0, 'POINT', 0, 'COMMA')} + ' €'">1.200 €</span>
                        <a th:href="@{/vivienda/{id}(id=${vivienda.viviendaID})}" class="btn-ver-mas">Ver más</a>
                    </div>
                </div>
            </div>

        </div>

    </main>

    <!-- SIDEBAR FILTROS -->
    <aside class="filters-sidebar" id="filtersSidebar" aria-hidden="true">
        <div class="filters-header">
            <h2>Filtros</h2>
            <button class="close-filters" id="closeFilters" type="button" aria-label="Cerrar filtros">
                <i class="fas fa-times"></i>
            </button>
        </div>
        <div class="filters-content">
            <div class="filter-group">
                <label for="filterType">Tipo de operación</label>
                <select id="filterType">
                    <option value="todos">Todos</option>
                    <option value="alquiler">Alquiler</option>
                    <option value="compra">Compra</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterLocation">Ubicación</label>
                <input type="text" id="filterLocation" placeholder="Ciudad o zona">
            </div>
            <div class="filter-group">
                <label for="filterMinPrice">Precio mínimo</label>
                <input type="number" id="filterMinPrice" placeholder="0">
            </div>
            <div class="filter-group">
                <label for="filterMaxPrice">Precio máximo</label>
                <input type="number" id="filterMaxPrice" placeholder="Máximo">
            </div>
            <button class="apply-filters-btn" id="applyFilters" type="button">Aplicar filtros</button>
        </div>
    </aside>

    <div class="overlay" id="overlay"></div>

    <!-- FOOTER -->
    <div th:replace="~{fragmentos/footer :: footer-principal}"></div>

    <script th:src="@{/js/script.js}"></script>
</body>
</html>
